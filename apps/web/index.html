<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta
      name="description"
      content="Lumacut is a video editor, motion graphics tool and photo editor in one browser studio, with templates, effects and export."
    />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <title>Lumacut</title>
    <script>
      // Set the theme before first paint (no flash). The editor is always dark.
      (function () {
        var theme = "system";
        try {
          var stored = JSON.parse(localStorage.getItem("lumacut.prefs.v1") || "{}");
          if (stored.theme === "light" || stored.theme === "dark") theme = stored.theme;
        } catch (e) {}
        var path = location.pathname;
        if (path.indexOf("/project/") === 0 || path.indexOf("/dev/") === 0) theme = "dark";
        if (theme === "system") {
          theme =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body class="bg-neutral-950 text-neutral-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
