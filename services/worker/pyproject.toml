[project]
name = "lumacut-worker"
version = "0.0.0"
description = "Lumacut worker: FFmpeg media pipeline, AI analysis/tools, server export (RQ)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "lumacut-schema",
  "lumacut-core",
  "pydantic-settings",
  "redis",
  "rq",
  "structlog",
  "numpy>=2.5.4",
  "pillow>=13.0.0",
  "playwright>=1.55",
]

[dependency-groups]
# Installed in the worker image so `make test-samples` can run pytest next to ffmpeg.
test = ["pytest", "pytest-asyncio", "pytest-xdist"]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
lumacut-schema = { workspace = true }
lumacut-core = { workspace = true }
