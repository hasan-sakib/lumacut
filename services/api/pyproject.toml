[project]
name = "lumacut-api"
version = "0.0.0"
description = "Lumacut backend API (FastAPI)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "lumacut-schema",
  "lumacut-core",
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "alembic",
  "redis",
  "rq",
  "aiobotocore",
  "structlog",
  "pyjwt>=2.15.1",
  "argon2-cffi>=25.1.0",
  "email-validator>=2.3.0",
  "sse-starlette>=3.6.0",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
lumacut-schema = { workspace = true }
lumacut-core = { workspace = true }
